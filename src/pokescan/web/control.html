<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pokescan control</title>
<style>
  /* Sized for an OBS Custom Browser Dock (300–500 px wide); OBS's dark theme. */
  :root {
    --bg: #1d1f26; --surface: #272a33; --field: #14161b; --edge: #3a3e4a;
    --text: #e8eaf0; --muted: #9aa0b0; --accent: #ffcb3d; --danger: #ff6b6b; --ok: #5fd38d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  section { background: var(--surface); border: 1px solid var(--edge); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .totals { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .totals .amount { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .totals .amount small { display: block; font-size: 15px; }
  .totals .count { color: var(--muted); }
  #conn { font-size: 12px; color: var(--muted); }
  #conn.down { color: var(--danger); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input, select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--edge);
    background: var(--field); color: var(--text); font: inherit;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* minmax(0, …): let inputs shrink below their intrinsic width in a narrow dock. */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 8px; }
  .price-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; }
  button, a.button {
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--edge); background: #343845;
    color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover, a.button:hover { background: #3d4250; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; }
  button.danger { color: var(--danger); }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions > * { flex: 1; }
  #status { min-height: 18px; margin-top: 8px; font-size: 12px; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--edge); }
  li:first-child { border-top: 0; }
  li .what { flex: 1; min-width: 0; }
  li .what .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .what .m { font-size: 12px; color: var(--muted); }
  li .p { font-variant-numeric: tabular-nums; font-weight: 600; }
  li.voided .what, li.voided .p { opacity: 0.45; text-decoration: line-through; }
  li button { padding: 3px 8px; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
  .url { display: flex; gap: 6px; margin-top: 4px; }
  .url input { font-size: 12px; color: var(--muted); }
  a.button { display: inline-block; text-align: center; text-decoration: none; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #343845; color: var(--muted); }
  .pill.held, .pill.focus { background: rgba(255, 203, 61, 0.16); color: var(--accent); }
  .pill.scanned { background: rgba(95, 211, 141, 0.16); color: var(--ok); }
  .pill.down { background: rgba(255, 107, 107, 0.16); color: var(--danger); }
  .problem { font-size: 12px; color: var(--danger); margin-top: 6px; }
  .thumb { width: 54px; height: 75px; object-fit: cover; border-radius: 4px; background: var(--field); flex: none; }
  li .thumb.small { width: 28px; height: 39px; }
  #attached { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  #attached .thumb { width: 72px; height: 100px; }
  .capture { display: block; }
  .capture .top { display: flex; gap: 10px; align-items: flex-start; }
  .choices { margin: 8px 0 2px 64px; display: grid; gap: 6px; }
  .choice { display: flex; gap: 8px; align-items: center; }
  .choice img { width: 36px; height: 50px; object-fit: cover; border-radius: 3px; flex: none; }
  .variants { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .variants button { padding: 4px 8px; font-size: 12px; }
  .variants button.best { border-color: var(--accent); }
  .msg { font-size: 12px; color: var(--muted); }
  .find { display: flex; gap: 6px; margin-top: 6px; }
  #set-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  #set-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #set-results button { display: block; width: 100%; text-align: left; margin-top: 4px; font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <section>
    <div class="totals">
      <div><h2>Session total</h2><div class="amount" id="amount">$0.00</div></div>
      <div style="text-align:right"><div class="count" id="count">0 cards</div><div id="conn">connecting…</div></div>
    </div>
    <div id="last-card" hidden>
      <div class="msg" style="margin-top:10px">Last card: <span id="last-name"></span> · printing:</div>
      <div class="variants" id="last-variants"></div>
    </div>
    <div class="actions"><button id="undo" title="Remove the last card from the total">Undo last</button></div>
  </section>

  <section id="scanner" hidden>
    <div class="head"><h2>Scanner</h2><span class="pill" id="scan-status">starting…</span></div>
    <div class="problem" id="scan-problem" hidden></div>
    <div id="set-box" hidden>
      <div id="set-row"><span class="msg">Set:</span><span class="name" id="set-name">any</span>
        <button type="button" id="set-change">Choose</button><button type="button" id="set-clear" hidden>Clear</button></div>
      <div class="find" id="set-find" hidden><input id="set-q" placeholder="Set name, e.g. Surging Sparks"><button type="button" id="set-go">Find</button></div>
      <div id="set-results"></div>
    </div>
    <ul id="captures"></ul>
  </section>

  <section>
    <h2>Add a card</h2>
    <form id="add" autocomplete="off">
      <input type="hidden" id="crop" name="crop">
      <div id="attached" hidden>
        <img class="thumb" id="attached-img" alt="Scanned card">
        <div><div class="m">From the scanner</div><button type="button" id="detach">Remove image</button></div>
      </div>
      <label for="name">Card name</label>
      <input id="name" name="name" required placeholder="Charizard ex">
      <div class="grid">
        <div><label for="set_name">Set</label><input id="set_name" name="set_name" placeholder="Obsidian Flames"></div>
        <div><label for="number">Number</label><input id="number" name="number" placeholder="125/197"></div>
      </div>
      <label for="variant">Variant</label>
      <input id="variant" name="variant" list="variants" placeholder="Holo">
      <datalist id="variants">
        <option value="Normal"><option value="Holo"><option value="Reverse Holo">
        <option value="1st Edition"><option value="1st Edition Holo"><option value="Full Art">
        <option value="Alt Art"><option value="Secret Rare">
      </datalist>
      <div class="price-row">
        <div><label for="price">Price</label><input id="price" name="price" required inputmode="decimal" placeholder="12.50"></div>
        <div><label for="currency">Currency</label>
          <select id="currency" name="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>JPY</option></select>
        </div>
      </div>
      <div class="actions"><button class="primary" type="submit">Add to total</button></div>
      <div id="status" role="status"></div>
    </form>
  </section>

  <section>
    <h2>This session</h2>
    <ul id="scans"></ul>
  </section>

  <section>
    <h2>Session</h2>
    <div class="actions">
      <a class="button" id="export" download>Export CSV</a>
      <button class="danger" id="new-session" type="button">New session</button>
    </div>
    <label for="overlay-url">Overlay URL (OBS Browser Source, at your canvas size)</label>
    <div class="url"><input id="overlay-url" readonly><button id="copy" type="button">Copy</button></div>
  </section>

<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const $ = id => document.getElementById(id);
  const money = (amount, currency) => {
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(Number(amount)); }
    catch { return `${amount} ${currency}`; }
  };

  $("export").href = `/export.csv?token=${encodeURIComponent(token)}`;
  $("overlay-url").value = `${location.origin}/overlay?token=${encodeURIComponent(token)}`;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("overlay-url").value); say("Overlay URL copied", "ok"); }
    catch { $("overlay-url").select(); say("Press Cmd/Ctrl+C to copy", "ok"); }
  };

  function say(text, kind = "") {
    $("status").textContent = text;
    $("status").className = kind;
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Pokescan-Token": token },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  const cropUrl = name => `/crops/${encodeURIComponent(name)}?token=${encodeURIComponent(token)}`;
  const thumb = (name, cls = "thumb") => {
    const img = document.createElement("img");
    img.className = cls; img.src = cropUrl(name); img.alt = "Scanned card"; img.loading = "lazy";
    return img;
  };

  function attach(name) {
    $("crop").value = name || "";
    $("attached").hidden = !name;
    if (name) $("attached-img").src = cropUrl(name);
  }
  $("detach").onclick = () => attach(null);

  const STATUS_CLASS = { "card held": "held", "waiting for focus": "focus", "scanned": "scanned" };
  let autoAttached = null;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  function variantButtons(captureId, card) {
    const row = el("div", "variants");
    const priced = card.variants.filter(v => v.price !== null);
    for (const v of priced) {
      const b = el("button", "", `${v.label} ${money(v.price, v.currency)}`);
      b.type = "button";
      b.onclick = () => api(`/captures/${captureId}/choose`, { card_id: card.card_id, variant: v.name })
        .then(scan => say(`Added ${scan.name} (${scan.variant}), ${money(scan.price, scan.currency)}`, "ok"))
        .catch(e => say(e.message, "error"));
      row.append(b);
    }
    if (!priced.length) row.append(el("span", "msg", "No price on Scrydex"));
    return row;
  }

  function cardChoice(captureId, card) {
    const row = el("div", "choice");
    if (card.image) { const img = el("img"); img.src = card.image; img.alt = ""; row.append(img); }
    const what = el("div", "what");
    what.append(el("div", "n", card.name), el("div", "m", [card.set_name, card.number && `#${card.number}`].filter(Boolean).join(" · ")));
    what.append(variantButtons(captureId, card));
    row.append(what);
    return row;
  }

  function findBox(captureId, initial) {
    const box = el("div");
    const row = el("div", "find");
    const q = el("input"); q.placeholder = "Search Scrydex, e.g. Ogerpon"; q.value = initial || "";
    const go = el("button", "", "Find"); go.type = "button";
    const results = el("div", "choices");
    const run = () => api_get(`/cards?q=${encodeURIComponent(q.value)}`)
      .then(cards => results.replaceChildren(...(cards.length ? cards.map(c => cardChoice(captureId, c)) : [el("div", "msg", "Nothing found.")])))
      .catch(e => say(e.message, "error"));
    go.onclick = run;
    q.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); run(); } };
    row.append(q, go);
    box.append(row, results);
    return box;
  }

  // Keep a capture's search box and results while state updates re-render the list.
  const openFinds = new Map();
  let capturesKey = null;

  function captureItem(c, identify) {
    const li = el("li", "capture");
    const top = el("div", "top");
    const what = el("div", "what");
    const card = c.card;
    const title = (card && card.name) || c.name || (c.state === "identifying" ? "Reading card…" : "Scanned card");
    what.append(el("div", "n", title));
    const sub = card ? [card.set_name, card.number && `#${card.number}`].filter(Boolean).join(" · ")
      : `${new Date(c.at).toLocaleTimeString()} · sharpness ${c.sharpness.toFixed(2)}`;
    what.append(el("div", "m", sub));
    if (c.message) what.append(el("div", "msg", c.message));
    const actions = el("div");
    if (c.state === "unknown" || c.state === "manual") {
      const add = el("button", "", "Type in"); add.type = "button";
      add.onclick = () => { attach(c.crop); $("name").focus(); };
      actions.append(add);
    }
    const dismiss = el("button", "", "Dismiss"); dismiss.type = "button";
    dismiss.onclick = () => {
      if ($("crop").value === c.crop) attach(null);
      api(`/captures/${c.id}/dismiss`).catch(e => say(e.message, "error"));
    };
    actions.append(dismiss);
    top.append(thumb(c.crop), what, actions);
    li.append(top);

    const choices = el("div", "choices");
    if (c.state === "pick variant" && card) choices.append(variantButtons(c.id, card));
    if (c.state === "pick card") choices.append(...c.candidates.map(cand => cardChoice(c.id, cand)));
    if (c.state === "unknown" && identify) {
      if (!openFinds.has(c.crop)) openFinds.set(c.crop, findBox(c.id, c.name));
      choices.append(openFinds.get(c.crop));
    }
    if (choices.childNodes.length) li.append(choices);
    return li;
  }

  function renderScanner(scanner, state) {
    $("scanner").hidden = !scanner;
    if (!scanner) return;
    // A scan that needs typing in goes straight into the form, unless a card is already being typed.
    const typeable = scanner.captures.find(c => c.state === "manual" || (c.state === "unknown" && !state.identify));
    if (typeable && typeable.crop !== autoAttached && !$("crop").value && !$("name").value) {
      autoAttached = typeable.crop;
      attach(typeable.crop);
      $("name").focus();
    }
    const status = $("scan-status");
    status.textContent = scanner.connected ? scanner.status : "OBS not connected";
    status.className = "pill " + (scanner.connected ? (STATUS_CLASS[scanner.status] || "") : "down");
    $("scan-problem").hidden = !scanner.problem;
    $("scan-problem").textContent = scanner.problem || "";
    $("set-box").hidden = !state.identify;
    $("set-name").textContent = state.stream_set ? state.stream_set.name : "any";
    $("set-clear").hidden = !state.stream_set;
    // Status changes several times a second; only rebuild the list when the scans change,
    // so typing in a search box isn't interrupted.
    const key = JSON.stringify([scanner.captures, state.identify]);
    if (key === capturesKey) return;
    capturesKey = key;
    const live = new Set(scanner.captures.map(c => c.crop));
    for (const crop of openFinds.keys()) if (!live.has(crop)) openFinds.delete(crop);
    if (!scanner.captures.length) {
      $("captures").replaceChildren(el("li", "empty", `Hold a card up to ${scanner.source} and keep it steady for a moment.`));
      return;
    }
    $("captures").replaceChildren(...scanner.captures.slice(0, 5).map(c => captureItem(c, state.identify)));
  }

  async function api_get(path) {
    const res = await fetch(path, { headers: { "X-Pokescan-Token": token } });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  $("set-change").onclick = () => { $("set-find").hidden = false; $("set-q").focus(); };
  $("set-clear").onclick = () => api("/settings/set", {}).catch(e => say(e.message, "error"));
  const findSets = () => api_get(`/sets?q=${encodeURIComponent($("set-q").value)}`)
    .then(sets => $("set-results").replaceChildren(...sets.map(x => {
      const b = el("button", "", `${x.name}${x.release_date ? ` (${x.release_date.slice(0, 4)})` : ""}`);
      b.type = "button";
      b.onclick = () => api("/settings/set", { id: x.id, name: x.name })
        .then(() => { $("set-results").replaceChildren(); $("set-find").hidden = true; $("set-q").value = ""; })
        .catch(e => say(e.message, "error"));
      return b;
    })))
    .catch(e => say(e.message, "error"));
  $("set-go").onclick = findSets;
  $("set-q").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); findSets(); } };

  // Switch the last card's printing in one click; the price on stream and the total follow.
  function renderLastCard(state) {
    const last = state.last, options = state.last_variants;
    $("last-card").hidden = !(last && options && options.length > 1);
    if ($("last-card").hidden) return;
    $("last-name").textContent = last.name;
    $("last-variants").replaceChildren(...options.map(v => {
      const b = el("button", v.label === last.variant ? "best" : "", `${v.label} ${money(v.price, v.currency)}`);
      b.type = "button";
      b.disabled = v.label === last.variant;
      b.onclick = () => api(`/scans/${last.id}/variant`, { variant: v.name })
        .then(scan => say(`${scan.name} is now ${scan.variant}, ${money(scan.price, scan.currency)}`, "ok"))
        .catch(e => say(e.message, "error"));
      return b;
    }));
  }

  function render(state) {
    renderLastCard(state);
    renderScanner(state.scanner, state);
    const totals = state.totals.length ? state.totals : [{ currency: "USD", amount: "0" }];
    $("amount").replaceChildren(...totals.map((t, i) => {
      const el = document.createElement(i ? "small" : "span");
      el.textContent = money(t.amount, t.currency);
      return el;
    }));
    $("count").textContent = `${state.count} card${state.count === 1 ? "" : "s"}`;

    if (!state.scans.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No cards yet.";
      $("scans").replaceChildren(li);
      return;
    }
    $("scans").replaceChildren(...state.scans.map(scan => {
      const li = document.createElement("li");
      li.className = scan.voided ? "voided" : "";
      const what = document.createElement("div");
      what.className = "what";
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = scan.name + (!scan.voided && scan.copy > 1 ? `  ×${scan.copy}` : "");
      const m = document.createElement("div");
      m.className = "m";
      m.textContent = [scan.variant, scan.set_name, scan.number && `#${scan.number}`].filter(Boolean).join(" · ") || " ";
      what.append(n, m);
      const p = document.createElement("div");
      p.className = "p";
      p.textContent = money(scan.price, scan.currency);
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = scan.voided ? "Restore" : "Remove";
      b.onclick = () => api(`/scans/${scan.id}/${scan.voided ? "restore" : "void"}`).catch(e => say(e.message, "error"));
      if (scan.crop) li.append(thumb(scan.crop, "thumb small"));
      li.append(what, p, b);
      return li;
    }));
  }

  $("add").onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    try {
      const scan = await api("/scans", data);
      say(`Added ${scan.name}, ${money(scan.price, scan.currency)}`, "ok");
      for (const f of ["name", "set_name", "number", "variant", "price"]) $(f).value = "";
      attach(null);
      $("name").focus();
    } catch (err) { say(err.message, "error"); }
  };

  $("undo").onclick = () => api("/undo")
    .then(scan => say(`Removed ${scan.name}`, "ok"))
    .catch(() => say("Nothing to undo", "error"));

  // Two clicks to end a session; no browser confirm(), which can hang an OBS dock.
  let armed = null;
  $("new-session").onclick = async () => {
    if (!armed) {
      $("new-session").textContent = "Click again to confirm";
      armed = setTimeout(() => { armed = null; $("new-session").textContent = "New session"; }, 4000);
      return;
    }
    clearTimeout(armed); armed = null;
    $("new-session").textContent = "New session";
    try { await api("/session/new"); say("New session started", "ok"); } catch (err) { say(err.message, "error"); }
  };

  let retry = 500;
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws.onopen = () => { retry = 500; $("conn").textContent = "live"; $("conn").className = ""; };
    ws.onmessage = e => render(JSON.parse(e.data));
    ws.onclose = () => {
      $("conn").textContent = "reconnecting…"; $("conn").className = "down";
      setTimeout(connect, retry); retry = Math.min(retry * 2, 8000);
    };
  }
  connect();
</script>
</body>
</html>
