<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pokescan overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* OBS Browser Source at the canvas size. Laid out at 1920×1080 and zoomed to fit,
     so 1440p and 4K canvases stay sharp. Transparent outside the panels.
     Styled after the rahatcodes brand (~/dev/rahatcodes-brand): ink, paper, and the green dot. */
  :root {
    --ink: rgba(11, 11, 11, 0.92);
    --card: #121212;
    --edge: #222222;
    --text: #ffffff;
    --muted: #9a9a9a;
    --brand: #2fae74;
    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    position: relative; width: 1920px; height: 1080px; color: var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  .panel {
    position: absolute; background: var(--ink); border: 1px solid var(--edge);
    border-radius: 14px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
  }
  /* Labels: small mono caps after a green dot, like the dot in "rahat." */
  .label {
    display: flex; align-items: center; gap: 10px;
    font: 500 15px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  .label::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); flex: none; }
  .dot { color: var(--brand); }

  #total { top: 40px; right: 40px; padding: 26px 34px 24px; min-width: 380px; text-align: right;
    background: rgba(11, 11, 11, 0.96); }
  #total .label { justify-content: flex-end; font-size: 20px; color: #c4c4c4; }
  #total .label::before { width: 12px; height: 12px; }
  #total .amounts { margin-top: 14px; }
  #total .amount { font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
  #total .amount + .amount { margin-top: 8px; font-size: 40px; color: var(--muted); }
  #total .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--edge); }
  #total .wordmark { height: 30px; width: auto; display: block; }
  #total .count { font: 500 26px/1 var(--mono); color: #c4c4c4; font-variant-numeric: tabular-nums; }
  #total.bump .amount:first-child { animation: bump 450ms ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.06); color: var(--brand); } 100% { transform: scale(1); } }

  #pull {
    left: 40px; bottom: 48px; padding: 20px; min-width: 420px; max-width: 860px;
    display: flex; gap: 26px; align-items: stretch;
    opacity: 0; transform: translateY(24px); transition: opacity 260ms ease, transform 260ms ease;
  }
  #pull.show { opacity: 1; transform: translateY(0); }
  #pull .art { width: 180px; height: 251px; object-fit: cover; border-radius: 10px; flex: none;
    border: 1px solid var(--edge); background: var(--card); }
  #pull .info { min-width: 320px; padding: 6px 8px 2px 0; display: flex; flex-direction: column; }
  #pull .name { margin-top: 16px; font-size: 42px; font-weight: 700; line-height: 1.08; letter-spacing: -0.025em; }
  #pull .name::after { content: "."; color: var(--brand); }
  #pull .name:empty::after, #pull .name.pending::after { content: none; }
  #pull .name.pending { color: var(--muted); }
  #pull .meta { margin-top: 10px; font: 400 19px/1.3 var(--mono); color: var(--muted); }
  #pull .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin-top: auto; padding-top: 18px; }
  #pull .price { font-size: 60px; font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; color: var(--brand);
    font-variant-numeric: tabular-nums; }
  #pull .price.pending { color: var(--muted); font: 500 24px/1 var(--mono); letter-spacing: 0.04em; }
  .badges { display: flex; gap: 8px; padding-bottom: 4px; }
  .badge { padding: 6px 12px; border-radius: 999px; font: 500 16px/1 var(--mono); color: var(--text);
    background: var(--card); border: 1px solid var(--edge); }
  .badge.repeat { color: var(--brand); border-color: var(--brand); }
  /* Lower thirds: a message now and then, bottom right, clear of the pull card. */
  #lower {
    right: 40px; bottom: 48px; min-width: 520px; max-width: 780px; padding: 20px 28px 22px; overflow: hidden;
    opacity: 0; transform: translateX(40px); transition: opacity 320ms ease, transform 320ms ease;
  }
  #lower.show { opacity: 1; transform: translateX(0); }
  #lower .title { margin-top: 12px; font-size: 34px; font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; }
  #lower .title::after { content: "."; color: var(--brand); }
  #lower .title.ends::after { content: none; }  /* already ends in "?" or "!" */
  #lower .detail { margin-top: 10px; font: 500 21px/1.3 var(--mono); color: var(--brand); }
  #lower .timer { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--brand);
    transform-origin: left; transform: scaleX(0); }
  #lower.show .timer { animation: drain var(--show-for, 12s) linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="total" class="panel">
    <div class="label">Session total</div>
    <div class="amounts"><div class="amount">$0.00</div></div>
    <div class="foot">
      <svg class="wordmark" viewBox="43 -764 2439 797" role="img" aria-label="rahat.">
        <path fill="#ffffff" d="M373 -496V-383H328Q260 -383 222.5 -347.0Q185 -311 185 -240V0H63V-493H178L185 -421Q201 -459 236.0 -481.0Q271 -503 319 -503Q345 -503 373 -496ZM558 13Q480 13 434.5 -29.0Q389 -71 389 -141Q389 -209 436.5 -250.0Q484 -291 572 -298L720 -309V-320Q720 -414 618 -414Q564 -414 535.0 -392.5Q506 -371 506 -332H402Q402 -412 462.5 -460.5Q523 -509 624.0 -509.0Q725 -509 782.0 -455.0Q839 -401 839 -300V0H732L723 -73Q707 -35 661.5 -11.0Q616 13 558 13ZM598 -79Q655 -79 688.0 -111.0Q721 -143 721 -200V-226L618 -218Q513 -208 513 -146Q513 -79 598 -79ZM1056 0H934V-744H1057V-430Q1081 -467 1123.0 -488.0Q1165 -509 1217 -509Q1307 -509 1355.0 -455.0Q1403 -401 1403 -304V0H1281V-275Q1281 -336 1253.5 -367.0Q1226 -398 1178 -398Q1121 -398 1088.5 -362.5Q1056 -327 1056 -270ZM1645 13Q1567 13 1521.5 -29.0Q1476 -71 1476 -141Q1476 -209 1523.5 -250.0Q1571 -291 1659 -298L1807 -309V-320Q1807 -414 1705 -414Q1651 -414 1622.0 -392.5Q1593 -371 1593 -332H1489Q1489 -412 1549.5 -460.5Q1610 -509 1711.0 -509.0Q1812 -509 1869.0 -455.0Q1926 -401 1926 -300V0H1819L1810 -73Q1794 -35 1748.5 -11.0Q1703 13 1645 13ZM1685 -79Q1742 -79 1775.0 -111.0Q1808 -143 1808 -200V-226L1705 -218Q1600 -208 1600 -146Q1600 -79 1685 -79ZM2182 0H2060V-392H1965V-494H2060V-648H2182V-494H2278V-392H2182Z"/>
        <path fill="#2fae74" d="M2300 -67Q2300 -100 2324.0 -123.5Q2348 -147 2381.0 -147.0Q2414 -147 2438.0 -123.5Q2462 -100 2462 -67Q2462 -35 2438.0 -11.5Q2414 12 2381.0 12.0Q2348 12 2324.0 -11.5Q2300 -35 2300 -67Z"/>
      </svg>
      <div class="count">0 cards</div>
    </div>
  </div>

  <div id="pull" class="panel" aria-live="polite">
    <img class="art" alt="" hidden>
    <div class="info">
      <div class="label">Pulled</div>
      <div class="name"></div>
      <div class="meta"></div>
      <div class="row">
        <div class="badges"><span class="badge variant"></span><span class="badge repeat"></span></div>
        <div class="price"></div>
      </div>
    </div>
  </div>

  <div id="lower" class="panel">
    <div class="label"></div>
    <div class="title"></div>
    <div class="detail"></div>
    <div class="timer"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const holdMs = Number(params.get("hold") || 8) * 1000;

  const fit = () => { document.documentElement.style.zoom = String(innerWidth / 1920); };
  addEventListener("resize", fit);
  fit();

  const money = (amount, currency) => {
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency }).format(Number(amount)); }
    catch { return `${amount} ${currency}`; }
  };

  const totalEl = document.getElementById("total");
  const pullEl = document.getElementById("pull");
  // What the pop-up shows: a priced card {kind: "scan", id}, or a card the scanner
  // just caught and nobody has priced yet {kind: "capture", crop}.
  let shown = null;
  let lastSeenId;    // newest scan id seen; unset until the first state, so a reload doesn't replay it
  let lastSeenKey;   // that scan's printing and price, to catch a corrected variant
  let lastCapture;   // newest scanner crop seen; crop names sort by time, across restarts too
  let lastTotals = null;
  let hideTimer = null;
  const PENDING_MAX_MS = 60000;  // a scan nobody prices doesn't stay on stream forever
  const cropUrl = name => `/crops/${encodeURIComponent(name)}?token=${encodeURIComponent(token)}`;

  function renderTotal(state) {
    const totals = state.totals.length ? state.totals : [{ currency: "USD", amount: "0" }];
    const amounts = totalEl.querySelector(".amounts");
    amounts.replaceChildren(...totals.map(t => {
      const div = document.createElement("div");
      div.className = "amount";
      div.textContent = money(t.amount, t.currency);
      return div;
    }));
    totalEl.querySelector(".count").textContent = `${state.count} card${state.count === 1 ? "" : "s"}`;
    const key = JSON.stringify(state.totals);
    if (lastTotals !== null && key !== lastTotals) {
      totalEl.classList.remove("bump"); void totalEl.offsetWidth; totalEl.classList.add("bump");
    }
    lastTotals = key;
  }

  function hidePull() {
    pullEl.classList.remove("show");
    shown = null;
    clearTimeout(hideTimer);
  }

  function setArt(crop) {
    const art = pullEl.querySelector(".art");
    art.hidden = !crop;
    if (crop) art.src = cropUrl(crop);
  }

  function popUp(what, holdFor) {
    pullEl.classList.add("show");
    shown = what;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hidePull, holdFor);
  }

  function showPull(scan) {
    setArt(scan.crop);
    pullEl.querySelector(".name").textContent = scan.name;
    pullEl.querySelector(".name").classList.remove("pending");
    pullEl.querySelector(".meta").textContent = [scan.set_name, scan.number && `#${scan.number}`].filter(Boolean).join(" · ");
    pullEl.querySelector(".meta").hidden = !scan.set_name && !scan.number;
    const variant = pullEl.querySelector(".variant");
    variant.textContent = scan.variant || "";
    variant.hidden = !scan.variant;
    const repeat = pullEl.querySelector(".repeat");
    repeat.textContent = `×${scan.copy}`;
    repeat.hidden = scan.copy < 2;
    const price = pullEl.querySelector(".price");
    price.textContent = money(scan.price, scan.currency);
    price.classList.remove("pending");
    popUp({ kind: "scan", id: scan.id }, holdMs);
  }

  // A scanned card before it's priced: its name as soon as it's read, then set and number once matched.
  function fillCapture(capture) {
    setArt(capture.crop);
    const card = capture.card;
    const name = (card && card.name) || capture.name;
    pullEl.querySelector(".name").textContent = name || "Identifying…";
    pullEl.querySelector(".name").classList.toggle("pending", !name);
    const meta = pullEl.querySelector(".meta");
    meta.textContent = card ? [card.set_name, card.number && `#${card.number}`].filter(Boolean).join(" · ") : "";
    meta.hidden = !meta.textContent;
    pullEl.querySelector(".variant").hidden = true;
    pullEl.querySelector(".repeat").hidden = true;
    const price = pullEl.querySelector(".price");
    price.textContent = name ? "Pricing…" : "";
    price.classList.add("pending");
  }

  function showCapture(capture) {
    fillCapture(capture);
    popUp({ kind: "capture", crop: capture.crop }, PENDING_MAX_MS);
  }

  // Sounds, played when a card's price lands: a Pokémon's cry, else a little 8-bit sound for
  // its kind, or the streamer's own file of that name. OBS lets browser sources autoplay.
  let ownSounds = {};
  let lastSound;  // the last scan's sound, so a corrected card plays only if its sound changed
  const fetched = new Set();
  const soundUrl = sound => sound && sound.startsWith("cry:")
    ? `/cries/${encodeURIComponent(sound.slice(4))}?token=${encodeURIComponent(token)}`
    : ownSounds[sound] && `/sounds/${encodeURIComponent(ownSounds[sound])}?token=${encodeURIComponent(token)}`;
  // Cries come mastered at full scale; both land around -10 dB, and OBS's mixer sets the overall level.
  const CRY_VOLUME = 0.35, SYNTH_VOLUME = 3.5;
  let audio = null;
  const tone = (at, freq, length, type = "square", volume = 0.09, slideTo = null) => {
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, at + length);
    gain.gain.setValueAtTime(volume * SYNTH_VOLUME, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + length);
    osc.connect(gain).connect(audio.destination);
    osc.start(at);
    osc.stop(at + length + 0.02);
  };
  // [seconds after start, Hz, length, wave, volume, slide to Hz]
  const SYNTH = {
    cash: [[0, 1976, 0.08], [0.07, 2637, 0.32, "square", 0.08]],
    item: [[0, 1047, 0.07], [0.06, 1319, 0.07], [0.12, 1568, 0.07], [0.18, 2093, 0.22, "square", 0.08]],
    supporter: [[0, 523, 0.12], [0.11, 659, 0.12], [0.22, 784, 0.12], [0.33, 1047, 0.5, "square", 0.08],
                [0.33, 523, 0.5, "triangle", 0.18]],
    stadium: [[0, 262, 0.9, "triangle", 0.22], [0, 392, 0.9, "triangle", 0.16], [0.05, 523, 0.85, "square", 0.05]],
    energy: [[0, 180, 0.28, "sawtooth", 0.07, 1800], [0.22, 1400, 0.12, "square", 0.06, 2600]],
  };
  function playSound(sound) {
    const url = soundUrl(sound);
    if (url) {
      const player = new Audio(url);
      player.volume = CRY_VOLUME;
      player.play().catch(() => synth(sound.startsWith("cry:") ? "cash" : sound));
      return;
    }
    synth(SYNTH[sound] ? sound : "cash");
  }
  function synth(name) {
    try {
      audio = audio || new AudioContext();
      if (audio.state === "suspended") audio.resume();
      const now = audio.currentTime + 0.02;
      for (const [after, ...note] of SYNTH[name] || SYNTH.cash) tone(now + after, ...note);
    } catch { /* no audio: the stream carries on silently */ }
  }
  // Fetch a matched card's cry while it's being priced, so it plays the moment the price lands.
  function prefetch(capture) {
    const url = capture && capture.card && soundUrl(capture.card.sound);
    if (url && !fetched.has(url)) { fetched.add(url); fetch(url).catch(() => fetched.delete(url)); }
  }

  function render(state) {
    renderTotal(state);
    ownSounds = state.sounds || {};
    const last = state.last;
    const captures = state.scanner ? state.scanner.captures : [];
    const newest = captures[0];
    const key = last ? `${last.id}|${last.card_id}|${last.variant}|${last.price}` : "";
    prefetch(newest);
    if (lastSeenId === undefined) {
      lastSeenId = last ? last.id : 0;
      lastSeenKey = key;
      lastSound = last && last.sound;
      lastCapture = newest ? newest.crop : "";
      return;
    }
    // A newly priced card, scanned or typed in. Scan ids only grow, across sessions too.
    if (last && last.id > lastSeenId) {
      lastSeenId = last.id; lastSeenKey = key; lastSound = last.sound;
      showPull(last); playSound(last.sound);
      return;
    }
    // The streamer corrected the printing or the card: show the right price again.
    if (last && last.id === lastSeenId && key !== lastSeenKey) {
      lastSeenKey = key;
      showPull(last);
      if (last.sound !== lastSound) { lastSound = last.sound; playSound(last.sound); }
      return;
    }
    // A card the scanner just caught: show it now, the price follows when it's added.
    if (newest && newest.crop > lastCapture) { lastCapture = newest.crop; showCapture(newest); return; }
    if (!shown) return;
    // Undone or dismissed: take it down now rather than leave a wrong card or price up.
    if (shown.kind === "scan" && (!last || last.id !== shown.id)) hidePull();
    if (shown.kind === "capture") {
      const current = captures.find(c => c.crop === shown.crop);
      if (current) fillCapture(current);  // name read, or card matched: update in place
      else hidePull();
    }
  }

  // Lower thirds, in turn: the first a minute after the overlay loads, then every few minutes.
  // ?every=<minutes> changes the gap, ?lower=off turns them off.
  const LOWER_THIRDS = [
    { label: "Socials", title: "Follow @rahatcodes", detail: "for more builds like this one" },
    { label: "Open source", title: "The card scanner is open source", detail: "github.com/Rahat-ch/pokescannerlive" },
    { label: "Work with me", title: "Want custom integrations for your stream?", detail: "Reach out · rahatcodes.com" },
  ];
  const lowerEl = document.getElementById("lower");
  const LOWER_EVERY_MS = Number(params.get("every") || 4) * 60000, LOWER_SHOW_MS = 12000, FIRST_LOWER_MS = 60000;
  let lowerNext = 0;
  function showLower() {
    if (shown) { setTimeout(showLower, 3000); return; }  // a pull on screen goes first
    const message = LOWER_THIRDS[lowerNext++ % LOWER_THIRDS.length];
    lowerEl.querySelector(".label").textContent = message.label;
    lowerEl.querySelector(".title").textContent = message.title;
    lowerEl.querySelector(".title").classList.toggle("ends", /[.?!]$/.test(message.title));
    lowerEl.querySelector(".detail").textContent = message.detail;
    lowerEl.style.setProperty("--show-for", `${LOWER_SHOW_MS}ms`);
    lowerEl.classList.remove("show"); void lowerEl.offsetWidth; lowerEl.classList.add("show");
    setTimeout(() => lowerEl.classList.remove("show"), LOWER_SHOW_MS);
    setTimeout(showLower, LOWER_EVERY_MS);
  }
  if (params.get("lower") !== "off") setTimeout(showLower, Number(params.get("first") || FIRST_LOWER_MS / 1000) * 1000);

  let retry = 500;
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws.onopen = () => { retry = 500; };
    ws.onmessage = e => render(JSON.parse(e.data));
    // Never show connection errors on stream; keep the last total up and retry quietly.
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 8000); };
  }
  connect();
</script>
</body>
</html>
